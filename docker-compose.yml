# Proyecto independiente de thepower-rag-pgvector. No reutilizar su red, volumen ni puerto.
name: thepower-rag-chatbot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      # Fijo: un .env de v1 con POSTGRES_DB=rag_multitenant no puede renombrar esta base.
      POSTGRES_DB: rag_chatbot
    ports:
      # Fijo en localhost:5434. No interpolar POSTGRES_PORT: un .env antiguo publica 5433.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: thepower-rag-chatbot_pgdata

networks:
  default:
    name: thepower-rag-chatbot_default
